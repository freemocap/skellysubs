[package]
name = "skellyspeak"
version = "3.1.5"
license = "AGPL-3.0-or-later"
edition = "2024"
default-run = "skellyspeak"

[features]
workflow-capture = []

[lib]
name = "skellyspeak_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive", "rc"] }
# Checkpoint checksums and execution identities require exact numeric round trips.
serde_json = { version = "1", features = ["float_roundtrip"] }
sys-locale = "0.3.2"
serde_yaml_ng = "0.10"
schemars = "0.8.22"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
regex = "1"
log = "0.4"
zip = { version = "4.6.1", default-features = false }
unicode-segmentation = "=1.13.3"
zeroize = "1"
sha2 = "0.10"
base64 = "0.22"
hound = "3.5"
getrandom = "0.3"
httpdate = "1"
tauri-plugin-opener = "2.5.5"
unicode-normalization = "0.1.24"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
# Build D-Bus from bundled source so Linux builds do not require libdbus-1-dev.
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["hooks"] }
tauri = { version = "2.11.5", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
cpal = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-diagnostic-sharing = { path = "src/diagnostics/ios" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"
