name: Deploy docs site

on:
  # Docs-only changes pushed to the active branch.
  push:
    branches: [main]
    paths:
      - 'docs/docs-site/**'
      - 'ui/src/**'
      - 'ui/tools/docs-demo/**'
      - 'package.json'
      - 'package-lock.json'
      - 'ui/package.json'
      - '.github/workflows/deploy-docs.yml'
  # Rebuild after every release so the docs pick up the new version.
  # NOTE: workflow_run only triggers when THIS file is on the default branch.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/docs-site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/docs-site/package-lock.json

      - run: npm ci
        working-directory: .
      - run: npm ci

      - run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/docs-site/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
